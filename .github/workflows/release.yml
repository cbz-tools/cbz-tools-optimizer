name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      CMAKE_TOOLCHAIN_FILE: "${{ github.workspace }}/cmake/turbojpeg-msvc-runtime.cmake"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-dav1d-${{ hashFiles('Cargo.lock') }}

      - name: Configure vcpkg file binary cache
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:GITHUB_WORKSPACE ".vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          Add-Content $env:GITHUB_ENV "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,readwrite"
          Write-Host "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,readwrite"

      - name: Install dav1d (vcpkg)
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install dav1d:x64-windows

          $src = "C:\vcpkg\installed\x64-windows\lib\pkgconfig\dav1d.pc"
          $pkgConfigPath = Get-ChildItem "C:\vcpkg\downloads\tools\msys2" -Recurse -Filter pkg-config.exe |
            Where-Object { $_.FullName -match "\\mingw64\\bin\\pkg-config\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (!(Test-Path $src) -or !$pkgConfigPath) {
            Write-Error "dav1d or pkg-config was not installed by vcpkg"
            exit 1
          }

          $pkgDir = Join-Path $env:RUNNER_TEMP "dav1d-pkgconfig"
          New-Item -ItemType Directory -Path $pkgDir | Out-Null
          (Get-Content $src) `
            -replace '^prefix=.*', 'prefix=C:/vcpkg/installed/x64-windows' `
            -replace '^includedir=.*', 'includedir=${prefix}/include' `
            -replace '^libdir=.*', 'libdir=${prefix}/lib' `
            -replace '"-L\$\{libdir\}"', '-L${libdir}' `
            -replace '"-I\$\{includedir\}"', '-I${includedir}' |
            Set-Content (Join-Path $pkgDir "dav1d.pc")

          Add-Content $env:GITHUB_ENV "PKG_CONFIG_PATH=$($pkgDir.Replace('\', '/'))"
          Add-Content $env:GITHUB_ENV "PKG_CONFIG=$pkgConfigPath"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build cores and launchers (release)
        shell: pwsh
        run: .\scripts\build_windows_release.ps1 -Workspace $env:GITHUB_WORKSPACE

      - name: Package artifacts
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          & .\scripts\package_windows_release.ps1 `
            -Version $tag `
            -Workspace $env:GITHUB_WORKSPACE `
            -OutputDir "target/package"

      - name: Assert Windows release ZIP contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = Join-Path "target/package" "cbz-tools-optimizer-${{ github.ref_name }}-windows-x64.zip"
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $root = "cbz-tools-optimizer-${{ github.ref_name }}-windows-x64/"
            $expected = @(
              "cbz-opt.exe",
              "cbz-opt-gui.exe",
              "README.md",
              "LICENSE",
              "THIRDPARTY_LICENSES.md",
              "third_party/dav1d/LICENSE",
              "third_party/svt-av1/LICENSE",
              "third_party/shiguredo_svt_av1/LICENSE"
            ) | Sort-Object
            $actual = @($archive.Entries | Where-Object { !$_.FullName.EndsWith('/') } |
              ForEach-Object { $_.FullName.Substring($root.Length) } | Sort-Object)
            if (@(Compare-Object $expected $actual).Count -gt 0) {
              throw "Windows release ZIP contents differ from the public allowlist: $($actual -join ', ')"
            }
            $forbidden = @($archive.Entries | Where-Object {
              $_.FullName -match '(?i)(UnRAR(?:64)?\.dll|dav1d\.dll|core\.exe$)'
            })
            if ($forbidden.Count -gt 0) {
              throw "Windows release ZIP contains forbidden runtime/core files: $($forbidden.FullName -join ', ')"
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Upload Windows release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: cbz-tools-optimizer-${{ github.ref_name }}-windows-x64
          path: |
            target/package/cbz-tools-optimizer-${{ github.ref_name }}-windows-x64.zip
          retention-days: 7

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/package/*.zip
          draft: false
          body: '[**Changelog**](https://github.com/cbz-tools/cbz-tools-optimizer/blob/master/CHANGELOG.md)'

  build-linux:
    name: Build Linux (CLI only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: sudo apt-get install -y libssl-dev libdav1d-dev pkg-config nasm

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build CLI
        env:
          SYSTEM_DEPS_DAV1D_LINK: static
        run: cargo build --release --locked -p cbz-tools-optimizer-cli

      - name: Package
        run: |
          tag="${{ github.ref_name }}"
          dir="cbz-tools-optimizer-${tag}-linux-x64"
          mkdir "$dir"
          cp target/release/cbz-opt-core "$dir/cbz-opt"
          cp README.md LICENSE THIRDPARTY_LICENSES.md "$dir/"
          mkdir -p "$dir/third_party/dav1d" "$dir/third_party/svt-av1" "$dir/third_party/shiguredo_svt_av1"
          cp third_party/dav1d/LICENSE "$dir/third_party/dav1d/"
          cp third_party/svt-av1/LICENSE "$dir/third_party/svt-av1/"
          cp third_party/shiguredo_svt_av1/LICENSE "$dir/third_party/shiguredo_svt_av1/"
          tar czf "${dir}.tar.gz" "$dir"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          body: '[**Changelog**](https://github.com/cbz-tools/cbz-tools-optimizer/blob/master/CHANGELOG.md)'

  build-macos:
    name: Build macOS (CLI only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dav1d
        run: brew install dav1d pkg-config nasm

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build CLI
        env:
          SYSTEM_DEPS_DAV1D_LINK: static
        run: cargo build --release --locked -p cbz-tools-optimizer-cli

      - name: Report macOS architecture
        run: |
          uname -m
          rustc -vV
          file target/release/cbz-opt-core

      - name: Package
        run: |
          tag="${{ github.ref_name }}"
          dir="cbz-tools-optimizer-${tag}-macos-arm64"
          mkdir "$dir"
          cp target/release/cbz-opt-core "$dir/cbz-opt"
          cp README.md LICENSE THIRDPARTY_LICENSES.md "$dir/"
          mkdir -p "$dir/third_party/dav1d" "$dir/third_party/svt-av1" "$dir/third_party/shiguredo_svt_av1"
          cp third_party/dav1d/LICENSE "$dir/third_party/dav1d/"
          cp third_party/svt-av1/LICENSE "$dir/third_party/svt-av1/"
          cp third_party/shiguredo_svt_av1/LICENSE "$dir/third_party/shiguredo_svt_av1/"
          tar czf "${dir}.tar.gz" "$dir"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          body: '[**Changelog**](https://github.com/cbz-tools/cbz-tools-optimizer/blob/master/CHANGELOG.md)'
