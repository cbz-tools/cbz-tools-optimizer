name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dav1d (vcpkg)
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install dav1d:x64-windows

          $src = "C:\vcpkg\installed\x64-windows\lib\pkgconfig\dav1d.pc"
          $pkgConfigPath = Get-ChildItem "C:\vcpkg\downloads\tools\msys2" -Recurse -Filter pkg-config.exe |
            Where-Object { $_.FullName -match "\\mingw64\\bin\\pkg-config\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (!(Test-Path $src) -or !$pkgConfigPath) {
            Write-Error "dav1d or pkg-config was not installed by vcpkg"
            exit 1
          }

          $pkgDir = Join-Path $env:RUNNER_TEMP "dav1d-pkgconfig"
          New-Item -ItemType Directory -Path $pkgDir | Out-Null
          (Get-Content $src) `
            -replace '^prefix=.*', 'prefix=C:/vcpkg/installed/x64-windows' `
            -replace '^includedir=.*', 'includedir=${prefix}/include' `
            -replace '^libdir=.*', 'libdir=${prefix}/lib' `
            -replace '"-L\$\{libdir\}"', '-L${libdir}' `
            -replace '"-I\$\{includedir\}"', '-I${includedir}' |
            Set-Content (Join-Path $pkgDir "dav1d.pc")

          Add-Content $env:GITHUB_ENV "PKG_CONFIG_PATH=$($pkgDir.Replace('\', '/'))"
          Add-Content $env:GITHUB_ENV "PKG_CONFIG=$pkgConfigPath"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI (release)
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
        run: cargo build --release --target x86_64-pc-windows-msvc -p cbz-tools-optimizer-cli

      - name: Build GUI (release)
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
        run: cargo build --release --target x86_64-pc-windows-msvc -p cbz-tools-optimizer-gui

      - name: Package artifacts
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          & .\scripts\package_windows_release.ps1 `
            -Version $tag `
            -Workspace $env:GITHUB_WORKSPACE `
            -OutputDir "target/package"

      - name: Upload Windows release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: cbz-tools-optimizer-${{ github.ref_name }}-windows-x64
          path: |
            target/package/cbz-tools-optimizer-${{ github.ref_name }}-windows-x64.zip
            target/package/cbz-tools-optimizer-${{ github.ref_name }}-windows-x64.zip.sha256
          retention-days: 7

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/package/*.zip
            target/package/*.zip.sha256
          draft: false

  build-linux:
    name: Build Linux (CLI only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: sudo apt-get install -y libssl-dev libdav1d-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI
        env:
          SYSTEM_DEPS_DAV1D_LINK: static
        run: cargo build --release -p cbz-tools-optimizer-cli

      - name: Package
        run: |
          tag="${{ github.ref_name }}"
          dir="cbz-tools-optimizer-${tag}-linux-x64"
          mkdir "$dir"
          cp target/release/cbz-opt "$dir/"
          cp README.md LICENSE THIRDPARTY_LICENSES.md "$dir/"
          mkdir -p "$dir/third_party/dav1d" "$dir/third_party/unrar" "$dir/third_party/svt-av1" "$dir/third_party/shiguredo_svt_av1"
          cp third_party/dav1d/LICENSE "$dir/third_party/dav1d/"
          cp third_party/unrar/LICENSE.txt "$dir/third_party/unrar/"
          cp third_party/svt-av1/LICENSE "$dir/third_party/svt-av1/"
          cp third_party/shiguredo_svt_av1/LICENSE "$dir/third_party/shiguredo_svt_av1/"
          tar czf "${dir}.tar.gz" "$dir"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"

  build-macos:
    name: Build macOS (CLI only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dav1d
        run: brew install dav1d pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI
        env:
          SYSTEM_DEPS_DAV1D_LINK: static
        run: cargo build --release -p cbz-tools-optimizer-cli

      - name: Package
        run: |
          tag="${{ github.ref_name }}"
          dir="cbz-tools-optimizer-${tag}-macos-x64"
          mkdir "$dir"
          cp target/release/cbz-opt "$dir/"
          cp README.md LICENSE THIRDPARTY_LICENSES.md "$dir/"
          mkdir -p "$dir/third_party/dav1d" "$dir/third_party/unrar" "$dir/third_party/svt-av1" "$dir/third_party/shiguredo_svt_av1"
          cp third_party/dav1d/LICENSE "$dir/third_party/dav1d/"
          cp third_party/unrar/LICENSE.txt "$dir/third_party/unrar/"
          cp third_party/svt-av1/LICENSE "$dir/third_party/svt-av1/"
          cp third_party/shiguredo_svt_av1/LICENSE "$dir/third_party/shiguredo_svt_av1/"
          tar czf "${dir}.tar.gz" "$dir"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
