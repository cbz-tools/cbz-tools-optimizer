name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dav1d (vcpkg)
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install dav1d:x64-windows

          $src = "C:\vcpkg\installed\x64-windows\lib\pkgconfig\dav1d.pc"
          $pkgConfigPath = Get-ChildItem "C:\vcpkg\downloads\tools\msys2" -Recurse -Filter pkg-config.exe |
            Where-Object { $_.FullName -match "\\mingw64\\bin\\pkg-config\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (!(Test-Path $src) -or !$pkgConfigPath) {
            Write-Error "dav1d or pkg-config was not installed by vcpkg"
            exit 1
          }

          $pkgDir = Join-Path $env:RUNNER_TEMP "dav1d-pkgconfig"
          New-Item -ItemType Directory -Path $pkgDir | Out-Null
          (Get-Content $src) `
            -replace '^prefix=.*', 'prefix=C:/vcpkg/installed/x64-windows' `
            -replace '^includedir=.*', 'includedir=${prefix}/include' `
            -replace '^libdir=.*', 'libdir=${prefix}/lib' `
            -replace '"-L\$\{libdir\}"', '-L${libdir}' `
            -replace '"-I\$\{includedir\}"', '-I${includedir}' |
            Set-Content (Join-Path $pkgDir "dav1d.pc")

          Add-Content $env:GITHUB_ENV "PKG_CONFIG_PATH=$($pkgDir.Replace('\', '/'))"
          Add-Content $env:GITHUB_ENV "PKG_CONFIG=$pkgConfigPath"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI (release)
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
        run: cargo build --release --target x86_64-pc-windows-msvc -p cbz-tools-optimizer-cli

      - name: Build GUI (release)
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
        run: cargo build --release --target x86_64-pc-windows-msvc -p cbz-tools-optimizer-gui

      - name: Package artifacts
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dir = "cbz-tools-optimizer-$tag-windows-x64"
          New-Item -ItemType Directory -Path $dir

          Copy-Item target/x86_64-pc-windows-msvc/release/cbz-opt.exe     $dir/
          Copy-Item target/x86_64-pc-windows-msvc/release/cbz-opt-gui.exe $dir/
          Copy-Item C:\vcpkg\installed\x64-windows\bin\dav1d.dll         $dir/
          Copy-Item README.md  $dir/
          Copy-Item LICENSE    $dir/
          Copy-Item THIRD_PARTY_NOTICES.md $dir/

          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          draft: false

  build-linux:
    name: Build Linux (CLI only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: sudo apt-get install -y libssl-dev libdav1d-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI
        env:
          SYSTEM_DEPS_DAV1D_LINK: static
        run: cargo build --release -p cbz-tools-optimizer-cli

      - name: Package
        run: |
          tag="${{ github.ref_name }}"
          dir="cbz-tools-optimizer-${tag}-linux-x64"
          mkdir "$dir"
          cp target/release/cbz-opt "$dir/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$dir/"
          tar czf "${dir}.tar.gz" "$dir"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"

  build-macos:
    name: Build macOS (CLI only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dav1d
        run: brew install dav1d pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI
        env:
          SYSTEM_DEPS_DAV1D_LINK: static
        run: cargo build --release -p cbz-tools-optimizer-cli

      - name: Package
        run: |
          tag="${{ github.ref_name }}"
          dir="cbz-tools-optimizer-${tag}-macos-x64"
          mkdir "$dir"
          cp target/release/cbz-opt "$dir/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$dir/"
          tar czf "${dir}.tar.gz" "$dir"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
