name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-git-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-git-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Set up MSVC and dav1d
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install dav1d:x64-windows

          $src = "C:\vcpkg\installed\x64-windows\lib\pkgconfig\dav1d.pc"
          $pkgConfigPath = Get-ChildItem "C:\vcpkg\downloads\tools\msys2" -Recurse -Filter pkg-config.exe |
            Where-Object { $_.FullName -match "\\mingw64\\bin\\pkg-config\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (!(Test-Path $src) -or !$pkgConfigPath) {
            Write-Error "dav1d or pkg-config was not installed by vcpkg"
            exit 1
          }

          $pkgDir = Join-Path $env:RUNNER_TEMP "dav1d-pkgconfig"
          New-Item -ItemType Directory -Path $pkgDir | Out-Null
          (Get-Content $src) `
            -replace '^prefix=.*', 'prefix=C:/vcpkg/installed/x64-windows' `
            -replace '^includedir=.*', 'includedir=${prefix}/include' `
            -replace '^libdir=.*', 'libdir=${prefix}/lib' `
            -replace '"-L\$\{libdir\}"', '-L${libdir}' `
            -replace '"-I\$\{includedir\}"', '-I${includedir}' |
            Set-Content (Join-Path $pkgDir "dav1d.pc")

          Add-Content $env:GITHUB_ENV "PKG_CONFIG_PATH=$($pkgDir.Replace('\', '/'))"
          Add-Content $env:GITHUB_ENV "PKG_CONFIG=$pkgConfigPath"
          Add-Content $env:GITHUB_PATH "C:\vcpkg\installed\x64-windows\bin"

      - name: Install dav1d (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev pkg-config

      - name: Install dav1d (macOS)
        if: runner.os == 'macOS'
        run: brew install dav1d pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build and verify Windows release package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
        run: |
          cargo build --release --target x86_64-pc-windows-msvc `
            -p cbz-tools-optimizer-cli `
            -p cbz-tools-optimizer-gui

          & .\scripts\package_windows_release.ps1 `
            -Version ci `
            -Workspace $env:GITHUB_WORKSPACE `
            -OutputDir "target/package"

          $packageName = "cbz-tools-optimizer-ci-windows-x64"
          $zipPath = "target/package/$packageName.zip"
          $hashPath = "$zipPath.sha256"
          if (!(Test-Path $zipPath) -or !(Test-Path $hashPath)) {
            throw "Release package or checksum was not created"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            $entries = @($archive.Entries.FullName)
          } finally {
            $archive.Dispose()
          }

          $expected = @(
            "$packageName/cbz-opt.exe",
            "$packageName/cbz-opt-gui.exe",
            "$packageName/dav1d.dll",
            "$packageName/README.md",
            "$packageName/LICENSE",
            "$packageName/THIRDPARTY_LICENSES.md",
            "$packageName/third_party/dav1d/LICENSE",
            "$packageName/third_party/svt-av1/LICENSE",
            "$packageName/third_party/shiguredo_svt_av1/LICENSE"
          )
          $missing = @($expected | Where-Object { $_ -notin $entries })
          if ($missing) {
            throw "Release package is missing: $($missing -join ', ')"
          }

          $expectedHash = (Get-Content $hashPath -Raw).Trim().Split(' ')[0]
          $actualHash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) {
            throw "Release package checksum does not match"
          }

      - name: Upload Windows release package
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v4
        with:
          name: cbz-tools-optimizer-ci-windows-x64
          path: |
            target/package/cbz-tools-optimizer-ci-windows-x64.zip
            target/package/cbz-tools-optimizer-ci-windows-x64.zip.sha256
          retention-days: 7

      - name: Build portable release CLI
        if: runner.os != 'Windows'
        env:
          SYSTEM_DEPS_DAV1D_LINK: static
        run: cargo build --release -p cbz-tools-optimizer-cli
